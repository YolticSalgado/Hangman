<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="hangman.css">
    <script src="hangman.js"></script>
    <title>Document</title>
</head>
<body>
    <!-- First Div: Hangman Image-->
    <div>
        <img src="images/hangman6.gif" alt="Picture of Hangman">
    </div>
    <!-- Second Div: Game Initiate Text-->
    <div id="clue">
        Press New Game to Play
    </div>
    <!-- Third Div: Guess Input & Button-->
    <div>
        <input type="text" size="1" maxlength="1">
        <button onclick="guess();">Guess</button>
    </div>
    <!-- Fourth Div: New Game Button-->
    <div id="newgamearea">
        <button onclick="newGame();">New Game</button>
    </div>
</body>
</html>
